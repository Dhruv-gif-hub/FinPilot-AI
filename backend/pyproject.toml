[project]
name = "finpilot-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhruv Bhatt", email = "dhruvbhatt938@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.161.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pymupdf>=2.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
finpilot-ai = "app:main"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"   
